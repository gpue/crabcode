version: "3.8"
services:
  diary-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary_password
      POSTGRES_DB: diary
    ports:
      - "5433:5432"
    volumes:
      - diary_pgdata:/var/lib/postgresql/data

volumes:
  diary_pgdata:
