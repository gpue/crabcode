# CrabTalk daemon configuration for crabcode
# Provider config — goes to ~/.crabtalk/config.toml

[system.crab]
model = "claude-sonnet-4"
compact_threshold = 100000

[provider.copilot]
kind = "openai"
base_url = "http://127.0.0.1:18791/v1"
api_key = "copilot-proxy"
models = ["claude-sonnet-4", "gpt-4o", "gpt-4.1", "o4-mini", "claude-opus-4"]
